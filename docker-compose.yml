services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirelog
      POSTGRES_DB: hirelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U hirelog"], interval: 5s, retries: 10}
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HIRELOG_DATABASE_URL: postgresql://hirelog:${POSTGRES_PASSWORD}@db:5432/hirelog
    depends_on: {db: {condition: service_healthy}}
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [app]
volumes: {pgdata: {}, caddy_data: {}, caddy_config: {}}
